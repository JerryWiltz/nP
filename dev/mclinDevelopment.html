<!DOCTYPE html>
<!-- Modified: 2026-06-30 -->
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width">
    <title>mclinDevelopment</title>
    <script src="../dist/nP.js"></script>
</head>

<body>
    <div id="tableDiv"></div>
    <div id="chartDiv"></div>
    <div id="smithDiv"></div>

    <script>
        var g = nP.global;
        g.fList = [1.8e9];

        var mil = 0.001 * 0.0254;
        var width = 19.1155 * mil;
        var space = 5.82185 * mil;
        var height = 25 * mil;
        var thickness = 0.0000125 * 0.0254;
        var length = 719.794 * mil;
        var er = 10;
        var rho = 1;
        var tand = 0.001;

        var coupledLine = nP.mclin(
            width,
            space,
            height,
            thickness,
            length,
            er,
            rho,
            tand
        );

        var coupler = nP.nodal(
            [coupledLine, 1, 2, 3, 4],
            ['out', 1, 2, 3, 4]
        );

        var tableOut = coupler.out('s21dB', 's41dB', 's11dB', 's31dB');
        var smithOut = coupler.out('s11Re', 's11Im');

        nP.lineTable({
            inputTable: [tableOut],
            title: 'Coupled Microstrip Line',
            mount: '#tableDiv',
            metricPrefix: 'giga',
            fontFamily: 'sans-serif',
            fontSize: 14
        });

        nP.lineChart({
            inputTable: [tableOut],
            title: 'Coupled Microstrip Line',
            mount: '#chartDiv',
            metricPrefix: 'giga',
            fontFamily: 'sans-serif',
            fontSize: 14
        });

        nP.smithChart({
            inputTable: [smithOut],
            title: 'Coupled Microstrip Line S11',
            mount: '#smithDiv',
            fontFamily: 'sans-serif',
            fontSize: 14
        });
    </script>
</body>

</html>
