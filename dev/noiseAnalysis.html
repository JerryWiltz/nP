<!DOCTYPE html>
<!-- Modified: 2026-10-03 -->
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Noise Analysis</title>
    <script src="../dist/nP.js"></script>
</head>

<body>
    <script>
        nP.global.fList = [1e9, 2e9];
        nP.global.Ro = 50;
        nP.global.Temp = 290;

        var attenuator = nP.Attn(3, 290);

        var defaultAmp = nP.Amp();
        var defaultViaNodal = nP.nodal(
            [defaultAmp, 1, 2],
            [attenuator, 2, 3],
            ['out', 1, 3]
        );
        var defaultViaCascade = nP.cascade(defaultAmp, attenuator);

        nP.log('Amp() via nodal');
        nP.log(defaultViaNodal.out('NF21dB'));
        nP.log('Amp() via cascade');
        nP.log(defaultViaCascade.out('NF21dB'));

        var positionalAmp = nP.Amp(20, 4);
        var positionalViaNodal = nP.nodal(
            [positionalAmp, 1, 2],
            [attenuator, 2, 3],
            ['out', 1, 3]
        );
        var positionalViaCascade = nP.cascade(positionalAmp, attenuator);

        nP.log('Amp(20, 4) via nodal');
        nP.log(positionalViaNodal.out('NF21dB'));
        nP.log('Amp(20, 4) via cascade');
        nP.log(positionalViaCascade.out('NF21dB'));

        var objectAmp = nP.Amp({
            spars: [
                nP.complex(0, 0), nP.complex(0, 0),
                nP.complex(10, 0), nP.complex(0, 0)
            ],
            fMinDb: 4,
            gammaOpt: nP.complex(0, 0),
            noiseResistanceOhms: 25,
            referenceTemperature: 290
        });
        var objectViaNodal = nP.nodal(
            [objectAmp, 1, 2],
            [attenuator, 2, 3],
            ['out', 1, 3]
        );
        var objectViaCascade = nP.cascade(objectAmp, attenuator);

        nP.log('Amp({...}) via nodal');
        nP.log(objectViaNodal.out('NF21dB'));
        nP.log('Amp({...}) via cascade');
        nP.log(objectViaCascade.out('NF21dB'));
    </script>
</body>

</html>
