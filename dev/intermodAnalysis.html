<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width">
    <title>Intermodulation Analysis</title>
    <script src="../dist/nP.js"></script>
</head>

<body>
    <div id="nodalChart"></div>
    <div id="nodalTable"></div>
    <div id="cascadeChart"></div>
    <div id="cascadeTable"></div>

    <script>
        // Sweep f1 from 1 to 2 GHz. f2 is always 1 MHz above f1.
        nP.global.fList = nP.global.fGen(1e9, 2e9, 11);
        nP.global.twoTone = {spacingHz: 1e6, p1dBm: -30, p2dBm: -25};

        var amp = nP.Amp({
            gainDb: 20,
            oip2dBm: 42,
            oip3dBm: 30
        });
        var attenuator = nP.Attn(3);

        var ampThenAtten = nP.nodal(
            [amp, 1, 2],
            [attenuator, 2, 3],
            ['out', 1, 3]
        );

        var nodalResults = ampThenAtten.out('OIP3lower21dBm');
        nP.lineChart({
            inputTable: [nodalResults],
            title: 'IP3 from nodal',
            mount: '#nodalChart',
            xAxisTitle: 'Frequency (GHz)',
            yAxisTitle: 'Output IP3 (dBm)',
            yRange: [0, 30],
            metricPrefix: 'giga'
        });
        nP.lineTable({
            inputTable: [nodalResults],
            title: 'IP3 from nodal',
            mount: '#nodalTable',
            metricPrefix: 'giga',
            columnWidth: 170
        });

        var ampThenAttenCascade = nP.cascade(amp, attenuator);
        var cascadeResults = ampThenAttenCascade.out('OIP3lower21dBm');
        nP.lineChart({
            inputTable: [cascadeResults],
            title: 'IP3 from cascade',
            mount: '#cascadeChart',
            xAxisTitle: 'Frequency (GHz)',
            yAxisTitle: 'Output IP3 (dBm)',
            yRange: [0, 30],
            metricPrefix: 'giga'
        });
        nP.lineTable({
            inputTable: [cascadeResults],
            title: 'IP3 from cascade',
            mount: '#cascadeTable',
            metricPrefix: 'giga',
            columnWidth: 170
        });

    </script>
</body>

</html>
