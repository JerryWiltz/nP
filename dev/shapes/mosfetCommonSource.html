<!doctype html>
<!-- Modified: 2026-11-26 -->
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Divider-biased MOSFET common-source amplifier</title>
    <script src="../../dist/nP.js"></script>
</head>
<body>
    <script>
        nP.global.fList = nP.global.fGen(1e6, 100e6, 51);
        nP.global.Temp = 300.15;
        // For the P-channel circuit, use PMOS({model: 'DMP58D0SV'}) and V(-12).
        var q1 = nP.NMOS({model: 'DMN55D0UT'});
        var v1 = nP.V(12);
        var r1 = nP.R(100e3);
        var r2 = nP.R(47e3);
        var r3 = nP.R(2200);
        var r4 = nP.R(1000);
        var c1 = nP.C(10e-9);
        var c2 = nP.C(10e-9);
        var c3 = nP.C(10e-9);
        var c4 = nP.C(10e-9);
        var t1 = nP.Tee4();
        var t2 = nP.Tee();
        var t3 = nP.Tee();
        var t4 = nP.Tee();
        var t5 = nP.Tee();
        var short1 = nP.Short();
        var network = nP.nodal(
            [c1, 1, 2],
            [t1, 9, 2, 21, 3],
            [q1, 3, 20, 11],
            [r1, 21, 6],
            [r2, 9, 10],
            [short1, 10],
            [t2, 18, 6, 8],
            [v1, 7, 17],
            [short1, 17],
            [r3, 18, 19],
            [t4, 4, 20, 19],
            [c4, 4, 5],
            [t3, 16, 8, 7],
            [c2, 16, 22],
            [short1, 22],
            [t5, 11, 14, 12],
            [r4, 12, 13],
            [short1, 13],
            [c3, 14, 15],
            [short1, 15],
            ['out', 1, 5]
        );
        var dc = network.operatingPoint;
        var dcTable = dc.out('vgs', 'vds', 'idmA', {component: q1, label: 'Q1'});
        nP.lineTable({inputTable: [dcTable], metricPrefix: 'none'});
        var response = network.out('s11dB', 's21dB');
        nP.lineChart({inputTable: [response], title: 'Divider-biased MOSFET: 50 ohm S-parameters', xAxisTitle: 'Frequency (MHz)', metricPrefix: 'M'});
        var drawing = nP.schematic(network);
    </script>
</body>
</html>
