<!DOCTYPE html>
<!-- Modified: 2026-10-03 -->
<html>
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width">
		<title>Edge coupled filter</title>
	</head>
	<body>
		<script src="../dist/nP.js"></script>
		<script>

// Sweep across the filter passband and both stopbands.
nP.global.fList = nP.global.fGen(2e9, 10e9, 101);

// set up the couplers
var tclin1 = nP.Tclin(79.667,37.834,0.491 * 0.0254);
var tclin2 = nP.Tclin(60.866,42.505,0.491 * 0.0254);
var tclin3 = nP.Tclin(79.667,37.834,0.491 * 0.0254);

// set up the open
var open = nP.Open();

// set up the filter
var filt = nP.nodal(
	[tclin1, 1, 2, 3, 4],
	[tclin2, 3, 5, 6, 7],
	[tclin3, 6, 8, 9, 10],
	[open, 2],
	[open, 4],
	[open, 5],
	[open, 7],
	[open, 8],
	[open, 10],
	['out', 1, 9]
);
// Two amplifiers feed the filter.
var amp1 = nP.Amp();
var amp2 = nP.Amp();
var chain = nP.cascade(amp1, amp2, filt);

var noiseFloor = chain.out('noiseFloor');
nP.lineChart({
	title: 'Output noise floor: two amplifiers and edge-coupled filter',
	inputTable: [noiseFloor],
	xAxisTitle: 'Frequency (GHz)',
	yAxisTitle: 'Output noise floor (dBm/Hz)',
	metricPrefix: 'giga'
});

		</script>
	</body>
</html>
