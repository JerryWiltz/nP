<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width">
    <title>lineTableDevelopment</title>
    <script src="../dist/nP.js"></script>
</head>

<body>
    <div id="chartDiv"></div>

    <script>
        var g = nP.global;
        g.fList = g.fGen(100e6, 1000e6, 5);

        var c1 = nP.seC(3.05e-12);
        var rl1 = nP.paSeRL(0.6, 56.4e-9);
        var c2 = nP.seC(23.55e-12);
        var hp = c1.cas(rl1).cas(c2);

        var rl2 = nP.seSeRL(0.3, 32.4e-9);
        var c3 = nP.paC(7.15e-12);
        var rl3 = nP.seSeRL(0.1, 33.5e-9);
        var lp = rl2.cas(c3).cas(rl3);

        var tee = nP.Tee();
        var filt = nP.nodal(
            [tee, 1, 2, 3],
            [hp, 2, 4],
            [lp, 3, 5],
            ['out', 1, 4, 5]
        );
        var filtOut = filt.out('s21dB', 's31dB', 's11dB');

        var table = {
            inputTable: [filtOut],
            title: 'My Table',
            mount: '#chartDiv',
            fontFamily: 'sans-serif',
            fontSize: 14
        };

        const myTable = nP.lineTable(table);
        myTable.setTxtTableTitleStyle({ fill: 'red', fontStyle: 'italic' });
    </script>
</body>

</html>
