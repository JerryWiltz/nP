<!DOCTYPE html>
<!-- Modified: 2026-11-26 -->
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>PNP curve tracer and RF</title>
    <script src="../dist/nP.js"></script>
</head>
<body>
    <script>
        // 2N3906 curve tracer and common-emitter RF analysis
        var g = nP.global;
        g.fList = g.fGen(10e6, 500e6, 31);
        g.twoTone = {spacingHz: 1e6, p1dBm: -70, p2dBm: -70};

        var q1 = nP.PNP({
            model: '2N3906',
            configuration: 'commonEmitter',
            bias: {
                ib: {start: 0, stop: -50e-6, points: 6},
                vce: {start: 0, stop: -10, points: 201}
            },
            qPoint: {ib: -20e-6, vce: -5},
            temperature: g.Temp
        });
        var short = nP.Short();
        var ce = nP.nodal(
            [q1, 1, 2, 3],
            [short, 3],
            ['out', 1, 2]
        );
        var curvesData = q1.ivTable();
        var curves = curvesData.out('icmA');
        var fixedBias = q1.bias;
        var response = ce.out('s11dB', 's21dB');
        var stability = ce.out('K', 'deltaMag');
        var noise = ce.out('NF21dB');
        var intercepts = ce.out('OIP2sum21dBm', 'OIP3lower21dBm');

        nP.lineChart({inputTable: [curves], title: '2N3906 common emitter: stepped IB',
            metricPrefix: 'none', xAxisTitle: 'VCE (V)', yAxisTitle: 'IC (mA)'});
        nP.lineChart({inputTable: [response], title: '2N3906 common-emitter S-parameters',
            metricPrefix: 'mega', xAxisTitle: 'Frequency (MHz)', yAxisTitle: 'S (dB)'});
        nP.lineChart({inputTable: [stability], title: 'Final two-port stability',
            metricPrefix: 'mega', xAxisTitle: 'Frequency (MHz)', yAxisTitle: 'K and |delta|'});
        nP.lineChart({inputTable: [noise], title: '2N3906 model noise figure',
            metricPrefix: 'mega', xAxisTitle: 'Frequency (MHz)', yAxisTitle: 'NF (dB)'});
        nP.lineChart({inputTable: [intercepts], title: '2N3906 direct Taylor intercept estimates',
            metricPrefix: 'mega', xAxisTitle: 'First-tone frequency (MHz)', yAxisTitle: 'OIP (dBm)'});
        nP.log(fixedBias);
        nP.schematic(ce);

        // Common-base curves: IC versus VCB, stepped outward IE
        var q2 = nP.PNP({configuration: 'commonBase', qPoint: {ie: -2e-3, vcb: -5}});
        var baseCurvesData = q2.ivTable();
        var baseCurves = baseCurvesData.out('icmA');
        nP.lineChart({inputTable: [baseCurves], title: '2N3906 common base: stepped IE',
            metricPrefix: 'none', xAxisTitle: 'VCB (V)', yAxisTitle: 'IC (mA)'});

        // Common collector retains negative VCE and reports outward IE
        var q3 = nP.PNP({configuration: 'commonCollector'});
        var collectorCurvesData = q3.ivTable();
        var collectorCurves = collectorCurvesData.out('iemA');
        nP.lineChart({inputTable: [collectorCurves], title: '2N3906 common collector: stepped IB',
            metricPrefix: 'none', xAxisTitle: 'VCE (V)', yAxisTitle: 'IE (mA)'});

    </script>
</body>
</html>
