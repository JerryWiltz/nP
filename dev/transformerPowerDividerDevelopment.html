<!DOCTYPE html>
<!-- Modified: 2026-06-27 -->
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width">
    <title>transformerPowerDividerDevelopment</title>
    <script src="../dist/nP.js"></script>
</head>

<body>
    <div id="tableDiv"></div>
    <div id="chartDiv"></div>
    <div id="smithDiv"></div>

    <script>
        var g = nP.global;
        g.fList = g.fGen(100e6, 1000e6, 101);

        var ratio = Math.sqrt(70.7 / 50);

        var trf1 = nP.trf(ratio);
        var trf2 = nP.trf(ratio);
        var tee1 = nP.Tee();
        var tee2 = nP.Tee();
        var rIso = nP.R(100);

        var divider = nP.nodal(
            [trf1, 1, 2],
            [trf2, 1, 3],

            [tee1, 4, 2, 5],
            [tee2, 6, 3, 7],

            [rIso, 4, 6],

            ['out', 1, 5, 7]
        );

        var tableOut = divider.out('s11dB', 's21dB', 's31dB', 's23dB');
        var smithOut = divider.out('s11Re', 's11Im', 's22Re', 's22Im', 's33Re', 's33Im');

        const table = nP.lineTable({
            inputTable: [tableOut],
            title: 'Transformer Power Divider',
            mount: '#tableDiv',
            metricPrefix: 'mega',
            backgroundColor: 'white',
            fontFamily: 'sans-serif',
            fontSize: 14
        });

        const chart = nP.lineChart({
            inputTable: [tableOut],
            title: 'Transformer Power Divider',
            mount: '#chartDiv',
            metricPrefix: 'mega',
            xAxisTitle: 'Frequency, MHz',
            yAxisTitle: 'dB',
            backgroundColor: 'white',
            fontFamily: 'sans-serif',
            fontSize: 14
        });

        const smithChart = nP.smithChart({
            inputTable: [smithOut],
            title: 'Transformer Power Divider Smith Chart',
            mount: '#smithDiv',
            metricPrefix: 'mega',
            backgroundColor: 'white',
            fontFamily: 'sans-serif',
            fontSize: 14
        });
    </script>
</body>

</html>
