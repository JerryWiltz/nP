<!DOCTYPE html>
<!-- Modified: 2026-06-27 -->
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width">
    <title>lineChartDevelopment</title>
    <script src="../dist/nP.js"></script>
</head>

<body>
    <div id="chartDiv"></div>
    <div id="testXYDiv"></div>
    <div id="testLogLogDiv"></div>

    <script>
        // from Compact Manual example #1 p27
        var g = nP.global;
        g.fList = g.fGen(100e6, 1000e6, 51);

        // high pass
        var c1 = nP.C(3.05e-12);
        var Tee = nP.Tee();
        var r1 = nP.R(0.6);
        var l1 = nP.L(56.4e-9)
        var c2 = nP.C(23.55e-12);
        var Short = nP.Short();
        var hp = nP.nodal(
            [c1, 1, 2],
            [Tee, 5, 2, 3],
            [c2, 3, 4],
            [r1, 5, 6],
            [l1, 6, 7],
            [Short, 7],
            ['out', 1, 4]
        );

        // low pass
        var r2 = nP.R(0.3);
        var l2 = nP.L(32.4e-9);
        // Tee reuse
        var c3 = nP.C(7.15e-12);
        var r3 = nP.R(0.1);
        var l3 = nP.L(33.5e-9);
        // Short reuse
        var lp = nP.nodal(
            [r2, 1, 2],
            [l2, 2, 3],
            [Tee, 7, 3, 4],
            [r3, 4, 5],
            [l3, 5, 6],
            [c3, 7, 8],
            [Short, 8],
            ['out', 1, 6]
        )

        //compbine into diplexer 
        //Tee reuse
        var filt = nP.nodal(
            [Tee, 1, 2, 3],
            [hp, 2, 4],
            [lp, 3, 5],
            ['out', 1, 4, 5]
        );
        var filtOut = filt.out('s11dB', 's21dB', 's31dB');

        const filtChart = nP.lineChart({
            inputTable: [filtOut],
            title: 'My Chart',
            mount: '#chartDiv',
            backgroundColor: 'white'
        });

        const testXYTable = [
            ['x', 'y = x + 1', 'y = -x + 1'],
            [-2, -1, 3],
            [-1, 0, 2],
            [0, 1, 1],
            [1, 2, 0],
            [2, 3, -1]
        ];

        const testXY = nP.lineChart({
            inputTable: [testXYTable],
            title: 'testXY',
            mount: '#testXYDiv',
            xAxisTitle: 'x',
            yAxisTitle: 'y',
            metricPrefix: 'none',
            xScale: 'linear',
            yScale: 'linear',
            xAxisPosition: 'origin',
            yAxisPosition: 'origin',
            xRange: [-2, 2],
            yRange: [-4, 4],
            backgroundColor: 'white'
        });

        const testLogLogTable = [
            ['x', 'y = x'],
            [10, 10],
            [100, 100],
            [1000, 1000],
            [10000, 10000]
        ];

        const testLogLog = nP.lineChart({
            inputTable: [testLogLogTable],
            title: 'testLogLog',
            mount: '#testLogLogDiv',
            xAxisTitle: 'x',
            yAxisTitle: 'y',
            metricPrefix: 'none',
            xScale: 'log',
            yScale: 'log',
            xAxisPosition: 'bottom',
            yAxisPosition: 'left',
            xRange: [10, 10000],
            yRange: [10, 10000],
            backgroundColor: 'white'
        });

    </script>
</body>

</html>
