<!DOCTYPE html>
<!-- Modified: 2026-10-14 -->
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Time Domain Development</title>
    <script src="../dist/nP.js"></script>
</head>
<body>
    <script>
        var message = 'now is the time for all good men to come to the aid of their country';
        var tx = nP.mod({mode: 'ASCII', message: message, bitRate: 1e9, samplesPerBit: 8, highVolts: 1e-3});
        var attenuationDb = 17.6;
        var attenuator = nP.Attn(attenuationDb, 290);
        var chain = nP.nodal(
            [attenuator, 1, 2],
            ['out', 1, 2],
            {signal: tx, inputPort: 1}
        );

        nP.log('Transmitted: ' + message);
        var rx = nP.demod(chain);
        var text = rx.out('ASCII text');
        nP.log('Received: ' + text);
        nP.log('Attenuation: ' + attenuationDb + ' dB');
        var ber = nP.bitErrorRate(tx, chain, {receptions: 100});
        nP.log('Measured BER: ' + ber.toExponential(2));
    </script>

    <h2>PN7 on a 200 MHz carrier</h2>
    <div id="pnChart"></div>
    <div id="pnCarrierChart"></div>
    <div id="pnReceivedChart"></div>
    <script>
        var pnCircuit = nP.global();
        pnCircuit.tList = pnCircuit.tGen(0, 126e-9, 127);
        pnCircuit.fList = [];

        var pn = nP.PN({stages: 7, time: pnCircuit.tList});
        var pnTx = nP.mod({input: pn, carrierHz: 200e6});
        var pnAttenuator = nP.Attn(3, 0);
        var pnChain = nP.cascade(pnAttenuator, {signal: pnTx});
        var pnRx = nP.demod(pnChain, {noise: false});

        nP.log('PN clock ticks: ' + pnCircuit.tList.length);
        nP.log('PN carrier: ' + pnTx.out('settings').carrierHz / 1e6 + ' MHz');
        nP.log('FFT samples: ' + pnTx.out('sample count'));
        nP.log('FFT frequencies: ' + pnTx.out('frequency count'));
        nP.log('Received PN bits: ' + pnRx.out('bits').join(''));

        nP.lineChart({
            inputTable: pn.out('waveform'),
            title: 'PN output at clock ticks',
            mount: '#pnChart'
        });
        nP.lineChart({
            inputTable: pnRx.out('carrier waveform'),
            title: 'Received 200 MHz carrier after 3 dB attenuation',
            mount: '#pnCarrierChart'
        });
        nP.lineChart({
            inputTable: pnRx.out('waveform'),
            title: 'Demodulated PN waveform',
            mount: '#pnReceivedChart'
        });
    </script>
</body>
</html>
