<!-- Modified: 2026-11-14 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 240" role="img" aria-labelledby="title description">
  <title id="title">CCVS — current-controlled voltage source</title>
  <desc id="description">Current-controlled voltage source. Two electrical terminals, not S-parameter ports. Terminal 1 is above terminal 2. Terminal 1 is positive relative to terminal 2. The controlling quantity is a model reference, not an additional drawn terminal.</desc>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <g fill="none" stroke="#202020" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <!-- Twenty-unit pins join the grid-aligned terminals to the source body. -->
    <path d="M140 70 V90 M140 150 V170"/>
    <path d="M140 90 L170 120 L140 150 L110 120 Z"/>
    <path d="M135 105 H145 M140 100 V110 M135 135 H145"/>
  </g>
  <g fill="#202020" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle">
    <text x="140" y="25">CCVS</text>
    <text x="140" y="205">Current-controlled voltage source</text>
    <text x="140" y="225">V = rm × Ic</text>
    <text x="160" y="75" text-anchor="start">Terminal 1</text>
    <text x="160" y="175" text-anchor="start">Terminal 2</text>
    <circle cx="140" cy="70" r="4"/>
    <circle cx="140" cy="170" r="4"/>
  </g>
</svg>
