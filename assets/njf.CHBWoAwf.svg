<!-- Modified: 2026-11-19 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 250" role="img" aria-labelledby="title description">
  <title id="title">NJF / MESFET / HEMT — N-channel FET artwork</title>
  <desc id="description">Shared N-channel FET artwork for NJF, MESFET and HEMT drawing names. Terminal 1 is the gate on the left, terminal 2 the drain above right, and terminal 3 the source below right. The gate arrow points inward toward the continuous channel. All terminals remain independent. NJF has a numerical constructor. MESFET and HEMT are drawing-only aliases; shared geometry does not select their material or equations.</desc>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <g fill="none" stroke="#202020" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <!-- Twenty-unit pins meet the circular body at their inner endpoints. -->
    <path d="M70 120 H90 M170 60 V80 M170 180 V160"/>
    <circle cx="140" cy="120" r="50"/>
    <!-- Continuous channel, drain/source branches and gate junction. -->
    <path d="M140 90 V150 M170 80 V90 H140 M170 160 V150 H140 M90 120 H140"/>
    <!-- N-channel gate arrow: inward toward the channel. -->
    <path d="M140 120 L120 110 V130 Z" fill="#202020"/>
  </g>
  <g fill="#202020" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle">
    <text x="140" y="25">NJF / MESFET / HEMT</text>
    <text x="35" y="105">Terminal 1</text>
    <text x="35" y="135">G</text>
    <text x="225" y="65">Terminal 2</text>
    <text x="225" y="85">D</text>
    <text x="225" y="185">Terminal 3</text>
    <text x="225" y="205">S</text>
    <text x="140" y="235">N-channel FET</text>
    <circle cx="70" cy="120" r="4"/>
    <circle cx="170" cy="60" r="4"/>
    <circle cx="170" cy="180" r="4"/>
  </g>
</svg>
