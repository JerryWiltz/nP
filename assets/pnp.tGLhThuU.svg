<!-- Modified: 2026-11-15 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 250" role="img" aria-labelledby="title description">
  <title id="title">PNP — three-terminal bipolar transistor</title>
  <desc id="description">PNP bipolar transistor artwork. Port 1 is the base on the left, port 2 the collector above right, and port 3 the emitter below right. The emitter arrow points inward toward the base. All ports remain independent. Numerical behavior is supplied by the PNP constructor.</desc>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <g fill="none" stroke="#202020" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <!-- Twenty-unit pins meet the circular body at their inner endpoints. -->
    <path d="M70 120 H90 M170 60 V80 M170 180 V160"/>
    <circle cx="140" cy="120" r="50"/>
    <!-- The base bar and the collector/emitter branches are internal artwork. -->
    <path d="M90 120 H120 M120 90 V150 M120 100 L170 80 M120 140 L170 160"/>
    <!-- PNP emitter arrow: inward along the lower-right branch. -->
    <path d="M140 148 L158 147 L152 161 Z" fill="#202020"/>
  </g>
  <g fill="#202020" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle">
    <text x="140" y="25">PNP</text>
    <text x="35" y="105">Port 1</text>
    <text x="35" y="135">B</text>
    <text x="210" y="65">Port 2</text>
    <text x="210" y="85">C</text>
    <text x="210" y="185">Port 3</text>
    <text x="210" y="205">E</text>
    <text x="140" y="235">PNP BJT</text>
    <circle cx="70" cy="120" r="4"/>
    <circle cx="170" cy="60" r="4"/>
    <circle cx="170" cy="180" r="4"/>
  </g>
</svg>
