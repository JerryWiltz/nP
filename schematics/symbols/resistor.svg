<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 160" role="img" aria-labelledby="title description">
  <title id="title">nP R two-port series resistor symbol</title>
  <desc id="description">A two-port series resistor with port 1 on the left and port 2 on the right.</desc>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <g fill="none" stroke="#202020" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M60 80 H80 L85 70 L95 90 L105 70 L115 90 L125 70 L135 90 L140 80 H160"/>
  </g>
  <g fill="#202020" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle">
    <text x="110" y="30">R()</text><text x="60" y="115">Port 1</text><text x="160" y="115">Port 2</text>
    <circle cx="60" cy="80" r="4"/><circle cx="160" cy="80" r="4"/>
  </g>
</svg>
