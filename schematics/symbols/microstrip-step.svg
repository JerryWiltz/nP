<svg xmlns="http://www.w3.org/2000/svg" viewBox="-60 -60 240 240" role="img" aria-labelledby="title description">
  <title id="title">nP mstep physical microstrip width-step symbol</title>
  <desc id="description">A two-port physical microstrip width step from a wide trace at port 1 to a narrow trace at port 2.</desc>
  <rect width="100%" height="100%" x="-60" y="-60" fill="#ffffff"/>
  <!-- Enlarge the compact copper silhouette without changing its proportions. -->
  <g transform="translate(-60 -60) scale(2)">
    <path d="M40 53 H60 V57 H80 V63 H60 V67 H40 Z" fill="#ffffff" stroke="#202020" stroke-width="1"/>
  </g>
  <path d="M0 60 H20 M100 60 H120" fill="none" stroke="#202020" stroke-width="2" stroke-linecap="round"/>
  <g fill="#202020" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle">
    <text x="60" y="-35">mstep()</text><text x="-30" y="65">Port 1</text><text x="150" y="65">Port 2</text>
    <circle cx="0" cy="60" r="4"/><circle cx="120" cy="60" r="4"/>
  </g>
</svg>
