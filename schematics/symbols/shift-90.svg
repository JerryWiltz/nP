<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 160" role="img" aria-labelledby="title description">
  <title id="title">nP Shift90 two-port phase-shift symbol</title>
  <desc id="description">A matched lossless two-port with a positive 90-degree through phase shift.</desc>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <g fill="none" stroke="#202020" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M80 80 H100 M180 80 H200"/><rect x="100" y="65" width="80" height="30"/></g>
  <g fill="#202020" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle">
    <text x="140" y="30">Shift90()</text><text x="140" y="80" text-anchor="middle" dominant-baseline="middle">+90°</text><text x="80" y="115">Port 1</text><text x="200" y="115">Port 2</text><circle cx="80" cy="80" r="4"/><circle cx="200" cy="80" r="4"/>
  </g>
</svg>
