<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 200" role="img" aria-labelledby="title description">
  <title id="title">nP Attn two-port attenuator</title>
  <desc id="description">A stylized two-port attenuator: a horizontal through line crosses a vertical resistor without top or bottom pins.</desc>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <g fill="none" stroke="#202020" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M100 80 H160"/>
    <path d="M130 50 L140 55 L120 65 L140 75 L120 85 L140 95 L120 105 L130 110"/>
  </g>
  <g fill="#202020" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle">
    <text x="100" y="145">Port 1</text><text x="160" y="145">Port 2</text>
    <circle cx="100" cy="80" r="4"/><circle cx="160" cy="80" r="4"/>
  </g>
</svg>
