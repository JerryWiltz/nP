<!-- Modified: 2026-11-19 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 160" role="img" aria-labelledby="title description">
  <title id="title">Zener — two-terminal diode artwork</title>
  <desc id="description">Zener diode artwork with terminal 1 the anode on the left and terminal 2 the cathode on the right. Angled ends on the cathode bar distinguish the Zener drawing. Both external pins are 20 units long. Zener is a drawing name only; no numerical constructor or specialized diode model is implemented. Terminal numbers are not package pin numbers.</desc>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <g fill="none" stroke="#202020" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <!-- Twenty-unit pins terminate at the anode body and cathode marking. -->
    <path d="M80 80 H100 M120 80 H140"/>
    <path d="M100 70 L120 80 L100 90 Z"/>
    <!-- Angled ends on the cathode bar distinguish the Zener drawing. -->
    <path d="M115 65 L120 70 V90 L125 95"/>
  </g>
  <g fill="#202020" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle">
    <text x="110" y="25">Zener</text>
    <text x="50" y="65">A</text>
    <text x="170" y="65">K</text>
    <text x="50" y="115">Terminal 1</text>
    <text x="170" y="115">Terminal 2</text>
    <text x="110" y="145">Zener · symbol only</text>
    <circle cx="80" cy="80" r="4"/>
    <circle cx="140" cy="80" r="4"/>
  </g>
</svg>
