<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 200" role="img" aria-labelledby="title description">
  <title id="title">nP Amp two-port amplifier</title>
  <desc id="description">An RF two-port amplifier with input port 1 and output port 2.</desc>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <g transform="translate(0 -10)">
<g fill="none" stroke="#202020" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M80 90 H100 M160 90 H180"/><path d="M100 50 L160 90 L100 130 Z"/><text x="120" y="90" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#202020" stroke="none" text-anchor="middle" dominant-baseline="middle">A</text>
  </g>
  </g>
  <g fill="#202020" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle">
    <text x="80" y="145">Port 1</text><text x="180" y="145">Port 2</text>
    <circle cx="80" cy="80" r="4"/><circle cx="180" cy="80" r="4"/>
  </g>
</svg>
