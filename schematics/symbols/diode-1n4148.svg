<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 160" role="img" aria-labelledby="title description">
  <title id="title">nP diode1N4148 two-port diode symbol</title>
  <desc id="description">A two-port 1N4148 diode model with anode at port 1 and cathode at port 2.</desc>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <g transform="translate(0 -10)">
<g fill="none" stroke="#202020" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M80 90 H100 M120 90 H140"/><path d="M100 80 L120 90 L100 100 Z"/><path d="M120 80 V100"/></g>
  </g>
  <g fill="#202020" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle">
    <text x="110" y="30">diode1N4148()</text><text x="80" y="125">Port 1</text><text x="140" y="125">Port 2</text><text x="50" y="70">anode</text><text x="170" y="70">cathode</text><circle cx="80" cy="80" r="4"/><circle cx="140" cy="80" r="4"/>
  </g>
</svg>
