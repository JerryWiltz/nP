<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 280" role="img" aria-labelledby="title description">
  <title id="title">nP trfAuto three-port autotransformer symbol</title>
  <desc id="description">A centered four-lobe tapped winding with port 1 at its center tap, port 2 at the upper winding end, and port 3 at the lower winding end.</desc>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <g fill="none" stroke="#202020" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M140 80 V100 C125 100 125 120 140 120 C125 120 125 140 140 140 C125 140 125 160 140 160 C125 160 125 180 140 180 V200 M112 90 V190 M118 90 V190 M140 140 H200 H220"/>
  </g>
  <g fill="#202020" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle">
    <text x="140" y="30">trfAuto()</text>
    <text x="220" y="115">Port 1</text>
    <text x="80" y="75">Port 2</text>
    <text x="80" y="215">Port 3</text>
    <circle cx="220" cy="140" r="4"/>
    <circle cx="140" cy="80" r="4"/>
    <circle cx="140" cy="200" r="4"/>
  </g>
</svg>
