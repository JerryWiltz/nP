<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 180" role="img" aria-labelledby="title description">
  <title id="title">nP mlin physical microstrip-line symbol</title>
  <desc id="description">A physical two-port microstrip line with port 1 on the left and port 2 on the right.</desc>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <!-- Match the Tlin() body and lead layout. -->
  <g fill="none" stroke="#202020" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M80 80 H100 M180 80 H200"/>
    <rect x="100" y="65" width="80" height="30"/>
  </g>
  <g fill="#202020" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle">
    <text x="140" y="30">mlin()</text><text x="140" y="145">width, height, length</text><text x="80" y="115">Port 1</text><text x="200" y="115">Port 2</text><circle cx="80" cy="80" r="4"/><circle cx="200" cy="80" r="4"/>
  </g>
</svg>
