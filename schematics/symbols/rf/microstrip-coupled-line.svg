<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" role="img" aria-labelledby="title description">
  <title id="title">nP mclin physical coupled-microstrip symbol</title>
  <desc id="description">A physical four-port coupled microstrip line numbered clockwise from the upper-left port.</desc>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <!-- Match the Tclin() paired bodies and lead layout. -->
  <g fill="none" stroke="#202020" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M100 100 H120 M200 100 H220 M100 140 H120 M200 140 H220"/>
    <rect x="120" y="85" width="80" height="30"/>
    <rect x="120" y="125" width="80" height="30"/>
  </g>
  <g fill="#202020" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle">
    <text x="160" y="30">mclin()</text><text x="100" y="70">Port 1</text><text x="220" y="70">Port 2</text><text x="220" y="185">Port 3</text><text x="100" y="185">Port 4</text>
    <circle cx="100" cy="100" r="4"/><circle cx="220" cy="100" r="4"/><circle cx="220" cy="140" r="4"/><circle cx="100" cy="140" r="4"/>
  </g>
</svg>
