<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-labelledby="title description">
  <title id="title">nP Tee4 four-port junction symbol</title>
  <desc id="description">An ideal four-port junction with common port 1 at the bottom and remaining ports numbered clockwise.</desc>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <g fill="none" stroke="#202020" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M80 120 H100 M120 80 V100 M140 120 H160 M120 140 V160"/><rect x="100" y="100" width="40" height="40"/><circle cx="120" cy="130" r="3" fill="#202020" stroke="none"/></g>
  <g fill="#202020" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle">
    <text x="120" y="30">Tee4()</text><text x="120" y="190">Port 1</text><text x="60" y="145">Port 2</text><text x="120" y="65">Port 3</text><text x="180" y="145">Port 4</text>
    <circle cx="120" cy="160" r="4"/><circle cx="80" cy="120" r="4"/><circle cx="120" cy="80" r="4"/><circle cx="160" cy="120" r="4"/>
  </g>
</svg>
