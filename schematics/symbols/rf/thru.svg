<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 200" role="img" aria-labelledby="title description">
  <title id="title">nP Thru two-port connection</title>
  <desc id="description">A matched zero-length two-port through connection, port 1 to port 2.</desc>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <g transform="translate(0 -10)">
<g fill="none" stroke="#202020" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M80 90 H100 M180 90 H200"/><rect x="100" y="75" width="80" height="30"/><text x="140" y="90" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#202020" stroke="none" text-anchor="middle" dominant-baseline="middle">THRU</text>
  </g>
  </g>
  <g fill="#202020" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle">
    <text x="80" y="145">Port 1</text><text x="200" y="145">Port 2</text>
    <circle cx="80" cy="80" r="4"/><circle cx="200" cy="80" r="4"/>
  </g>
</svg>
