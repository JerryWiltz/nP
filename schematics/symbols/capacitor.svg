<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 160" role="img" aria-labelledby="title description">
  <title id="title">nP C two-port series capacitor symbol</title>
  <desc id="description">A two-port series capacitor with port 1 on the left and port 2 on the right.</desc>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <g fill="none" stroke="#202020" stroke-width="2" stroke-linecap="round">
    <path d="M80 80 H105 M115 80 H140 M105 70 V90 M115 70 V90"/>
  </g>
  <g fill="#202020" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle">
    <text x="110" y="30">C()</text><text x="80" y="115">Port 1</text><text x="140" y="115">Port 2</text>
    <circle cx="80" cy="80" r="4"/><circle cx="140" cy="80" r="4"/>
  </g>
</svg>
