<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 200" role="img" aria-labelledby="title description">
  <title id="title">nP Tee three-port junction symbol</title>
  <desc id="description">An ideal three-port Tee with common port 1 at the bottom, port 2 on the left, and port 3 on the right.</desc>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <g fill="none" stroke="#202020" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M80 100 H100 M140 100 H160 M120 120 V140"/><rect x="100" y="80" width="40" height="40"/><circle cx="120" cy="110" r="3" fill="#202020" stroke="none"/></g>
  <g fill="#202020" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle">
    <text x="120" y="30">Tee()</text><text x="120" y="170">Port 1</text><text x="60" y="125">Port 2</text><text x="180" y="125">Port 3</text>
    <circle cx="120" cy="140" r="4"/><circle cx="80" cy="100" r="4"/><circle cx="160" cy="100" r="4"/>
  </g>
</svg>
