<svg xmlns="http://www.w3.org/2000/svg" viewBox="-60 -60 240 240" role="img" aria-labelledby="title description">
  <title id="title">nP mbend right-turn physical microstrip bend symbol</title>
  <desc id="description">A two-port 90-degree physical microstrip bend with port 1 entering from the left and turning right to port 2 at the bottom.</desc>
  <rect width="100%" height="100%" x="-60" y="-60" fill="#ffffff"/>
  <!-- Mirror the left-turn conductor vertically so port 2 exits downward. -->
  <g transform="translate(-60 -60) scale(2)">
    <path d="M40 67 H53 V80 H67 V60 L60 53 H40 Z" fill="#ffffff" stroke="#202020" stroke-width="1"/>
  </g>
  <path d="M0 60 H20 M60 100 V120" fill="none" stroke="#202020" stroke-width="2" stroke-linecap="round"/>
  <g fill="#202020" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle">
    <text x="60" y="-35">mbend() right turn</text><text x="-30" y="65">Port 1</text><text x="60" y="150">Port 2</text>
    <circle cx="0" cy="60" r="4"/><circle cx="60" cy="120" r="4"/>
  </g>
</svg>
