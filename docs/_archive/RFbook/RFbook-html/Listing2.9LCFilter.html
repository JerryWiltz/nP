<!DOCTYPE html>
<!-- Modified: 2026-06-27 -->
<html>
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width">
		<title>Listing 2.9 LC Filter</title>
	</head>
	<body id="body">
		<script src="../../../../dist/nP.js"></script>
		<script>

// Generate frequency list
g = nP.global;
g.fList = g.fGen(0.1e9, 10e9, 101);

// define the Low Pass
var C1 = nP.C(1e-12);
var L1 = nP.L(5e-9);
var C2 = nP.C(1e-12);
var Tee = nP.Tee();
var Short = nP.Short();
var LCLowPass = nP.nodal(
	[Tee, 2, 1, 3],
	[C1, 2, 4],
	[Short, 4],
	[L1, 3, 5],
	[Tee, 6, 5, 7],
	[C2, 6, 8],
	[Short, 8],
	['out', 1, 7]
);
var Plot = LCLowPass.out('s11dB', 's21dB');

// plot the results
var chart1 = nP.lineChart({inputTable: [Plot]});

		</script>
	</body>
</html>
