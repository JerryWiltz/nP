<!DOCTYPE html>
<!-- Modified: 2026-06-27 -->
<html>
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width">
		<title>nodal repeated RLC section</title>
	</head>
	<body>
		<script src="../../../../dist/nP.js"></script>

		<script>
// from Gupta page 336, 346-347
// uses default values for frequency and component values

function rlcSection(rValue, lValue, cValue) {
	var r = nP.R(rValue);
	var l = nP.L(lValue);
	var c = nP.C(cValue);

	return nP.nodal(
		[r, 1, 2],
		[l, 2, 3],
		[c, 3, 4],
		['out', 1, 4]
	);
}

nP.log('single repeated RLC section');
var section = rlcSection(75 / 5, 5e-9 / 5, 1e-12 * 5);
nP.log(section.out('s11mag','s11ang','s21mag','s21ang'));

nP.log('five sections connected with nP.nodal()');
var nodal = nP.nodal(
	[section, 1, 2],
	[section, 2, 3],
	[section, 3, 4],
	[section, 4, 5],
	[section, 5, 6],
	['out', 1, 6]
).out('s11mag','s11ang','s21mag','s21ang');
nP.log(nodal);
		</script>
	</body>
</html>
