<!DOCTYPE html>

<html>
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width">
		<title>Tlin and Tee</title>
	</head>
	<body>
		<script src="../../../../dist/nP.js"></script>

		<script>
//from Medley page 30 to 31
//uses default values for frequency and components
nP.log('transmision line, Tlin()');
var Tlin = nP.Tlin();
nP.log(Tlin.out('s11mag','s11ang','s21mag','s21ang'));

nP.log('open circuit transmission line in parallel')
var open = nP.Open();
var tee = nP.Tee();
var openParallelStub = nP.nodal(
	[tee, 2, 1, 3],
	[Tlin, 2, 4],
	[open, 4],
	['out', 1, 3]
).out('s11mag','s11ang','s21mag','s21ang');
nP.log(openParallelStub);

nP.log('short circuit transmission line in parallel');
var short = nP.Short();
var shortParallelStub = nP.nodal(
	[tee, 2, 1, 3],
	[Tlin, 2, 4],
	[short, 4],
	['out', 1, 3]
).out('s11mag','s11ang','s21mag','s21ang');
nP.log(shortParallelStub);

		</script>
	</body>
</html>
