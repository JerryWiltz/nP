<!--DOCTYPE html-->
<html>
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width">
		<title>Tee() and nodal() demo Example</title>
	</head>
	<body>

		<script src="../../../../dist/nP.js"></script>

		<script>

var r150 = nP.R(150);
var r37  = nP.R(37.5);

var r75  = nP.R(75);

var l5   = nP.L(5e-9);

var Tee  = nP.Tee();

//Test 1 backToBack Tee's
var backToBack1 = nP.nodal([Tee,1,3,2],[Tee,4,2,3],['out',1,4]).out('s11dB', 's21dB');

//Test 2 backToBack with parallel resistors between Tee's
var backToBack2 = nP.nodal([Tee,1,4,2],[r150,2,3],[r150,4,5],[Tee,6,5,3],['out',1,6]).out('s11mag', 's21mag');

//Test 3 backToBack with parallel resistor and inductor between Tee's
var backToBack3 = nP.nodal([Tee,1,4,2],[r75,2,3],[l5,4,5],[Tee,6,5,3],['out',1,6]).out('s11mag', 's21mag');

var Short = nP.Short()

var sp = nP.nodal(
	[Tee, 1, 2, 3],
	[r150, 1, 4],
	[Short, 4],
	[r150, 3, 5],
	['out', 2, 5]
).out('s11mag', 's11ang', 's21mag', 's21ang');

var altsp = nP.nodal([Tee,1,4,2],[r150,2,3],[r150,4,5],[Short,5],['out',1,3]).out('s11mag', 's11ang', 's21mag', 's21ang');

var parl = nP.nodal([Tee,1,3,2],[r37,3,4],[l5,4,5],[Tee,5,6,8],[r75,6,7],[r75,8,9],[Short,7],[Short,9],['out',1,2]).out('s11mag','s12mag','s12ang');

nP.log('Test 1 backToBack Tees')
nP.log(backToBack1);

nP.log('Test 2 backToBack with parallel resistors between Tees')
nP.log(backToBack2);

nP.log('Test 3 backToBack with parallel resistor and inductor between Tees')
nP.log(backToBack3);

nP.log('s-Parmeters')
nP.log(sp);

nP.log('Alternate s-Parmeters')
nP.log(altsp);

nP.log('s-Parmeters')
nP.log(parl);


		</script>
	</body>
</html>
